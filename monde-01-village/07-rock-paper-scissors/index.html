<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pierre Papier Ciseaux</title>
    <link rel="stylesheet" href="../../common.css" />
    <script src="./script.js" type="module"></script>
</head>
<body>
    <main class="flex flex-column gap-2">
        
        <div class="flex flex-column gap-1">
            <span>Humain: <span id="score-human">0</span></span>
            <span>Bot : <span id="score-bot">0</span></span>
        </div>

        <div class="screen flex flex-colum flex-align-center flex-justify-center" id="duel"></div>
        
        <div class="screen flex flex-colum flex-align-center flex-justify-center" id="result"></div>

        <div class="grid grid-3 gap-2">
            <button id="rock" data-action="rock">Pierre</button>
            <button id="paper" data-action="paper">Feuille</button>
            <button id="scissors" data-action="scissors">Ciseaux</button>
        </div>

    </main>
</body>
</html>
