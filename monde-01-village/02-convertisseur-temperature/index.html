<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur de température</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="board">
        <span class="column-2" id="value">Rentrez une valeur</span>
        <input class="column-2" id="input" type="number" step="0.1">
        <button id="C2F" data-mode="c2f">°C => °F</button>
        <button id="F2C" data-mode="f2c">°F => °C</button>
    </div>
</body>
</html>
