<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    
    <script src="./script.js" defer async></script>
</head>
<body>
    
    <div class="main">
        <div id="screen">
            <div id="screen-password"></div>
            <div class="v-separator"></div>
            <button id="clipboard"><i class="fa-solid fa-copy"></i></button>
        </div>

        <label for="longueur">
            <span>Longueur : </span>
            <input type="number" name="" id="longueur" value="20" min="1" max="50">
        </label>

        <div class="options">
            <label for="chiffres">
                <input type="checkbox" id="chiffres" checked>
                Chiffres
            </label>
            <label for="symboles">
                <input type="checkbox" id="symboles" checked>
                Symboles
            </label>
            <label for="uppercases">
                <input type="checkbox"id="uppercases" checked>
                Majuscules
            </label>
            <label for="lowercases">
                <input type="checkbox" id="lowercases" checked>
                Minuscules
            </label>
        </div>
    </div>

    <div class="dialog"></div>

</body>
</html>
